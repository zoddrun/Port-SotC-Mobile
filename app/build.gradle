plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.portsotc.mobile'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.portsotc.mobile'
        minSdk 28
        targetSdk 34
        versionCode 4
        versionName '0.3.1'

        buildConfigField 'String', 'SUPPORTED_ABI', '"arm64-v8a"'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -fexceptions -frtti'
                // Static C++ runtime, matching the runner. c++_shared packages
                // libc++_shared.so with 4 KB PT_LOAD alignment, which cannot
                // load on 16 KB page devices. libsotc_core.so is only loaded
                // from our own JNI bridge, so a static runtime is safe here.
                arguments '-DANDROID_STL=c++_static'
            }
        }

        ndk {
            // arm64-v8a is the shipping target. x86_64 is kept for emulator
            // integration tests and is not a supported device target.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
